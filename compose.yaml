
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: version-aware-rag-app

    ports:
      - "8000:8000"

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      RAG_MAX_COSINE_DISTANCE: ${RAG_MAX_COSINE_DISTANCE:-0.65}
      RAG_API_KEY: ${RAG_API_KEY:?Set RAG_API_KEY in your .env file}

    volumes:
      - ./data:/app/data
      - huggingface_cache:/home/appuser/.cache/huggingface

    depends_on:
      ollama:
        condition: service_healthy

    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest

    container_name: version-aware-rag-ollama

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    restart: unless-stopped

volumes:
  ollama_data:
  huggingface_cache:
